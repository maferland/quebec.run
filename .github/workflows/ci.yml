name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Use local services - not secrets (so dependabot can run CI)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/courses_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/courses_test
      NEXTAUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
      NEXTAUTH_URL: http://localhost:3000
      EMAIL_FROM: test@example.com
      USE_RESEND: 'false'
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: '1025'
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: courses_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Seed test database
        run: npm run db:seed

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest

    env:
      # Dummy values for prisma generate (doesn't connect, just needs valid format for Zod validation)
      DATABASE_URL: postgresql://localhost:5432/dummy
      NEXTAUTH_SECRET: dummy-secret-at-least-32-characters-long-for-validation
      EMAIL_FROM: dummy@example.com
      USE_RESEND: 'false'
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: '1025'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit
